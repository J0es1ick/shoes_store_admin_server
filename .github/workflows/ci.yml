name: Validate API
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: step_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: step_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U step_test -d step_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: step_test
      DB_PASSWORD: isolated-ci-password
      DB_NAME: step_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run store:migrate
      - run: npm run test:postgres
      - run: npm run build
      - run: docker compose --env-file .env.docker.example config --quiet
      - run: docker build -t step-api .
